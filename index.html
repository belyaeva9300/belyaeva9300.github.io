<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masha Belyaeva</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    @font-face {
      font-family: "Gaussian Blur";
      src: url("fonts/gaussian_blur/gaussian_blur/Gaussian%20Blur.ttf") format("truetype");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      position: relative;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Per-letter blur effect (letters are wrapped by the script below) */
    .word { white-space: nowrap; }
    .ch {
      display: inline-block;
      cursor: default;
      transition: filter 0.3s;
    }
    .ch:hover { filter: blur(3px); }

    /* Smaller text gets a lighter blur so it stays readable */
    .project .ch:hover { filter: blur(2px); }

    h1 {
      position: absolute;
      top: 24px;
      left: 28px;
      font-family: "Gaussian Blur", "Helvetica Neue", Arial, sans-serif;
      font-size: 2rem;
      font-weight: normal;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem;
    }

    main p {
      max-width: 38rem;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .links {
      margin-top: 2.5rem;
      display: flex;
      gap: 1.75rem;
    }

    .links a {
      color: #111;
      font-size: 1.8rem;
      text-decoration: none;
    }

    /* Project box, scattered around the page */
    .project {
      position: absolute;
      width: 12rem;
      padding: 0.9rem 1rem;
      border: 1px solid #111;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .project h2 {
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
    }

    .project-3 { top: 76%; right: 14%; }

    /* Wrapper is invisible on desktop so logos keep their own positions */
    .logos { display: contents; }

    .logo-link {
      position: absolute;
      top: 14%;
      right: 9%;
      display: block;
      width: 6rem;
    }
    .logo-link img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.3s;
    }
    .logo-link:hover img { transform: scale(1.08); }

    .logo-2 {
      top: 60%;
      right: auto;
      left: 6%;
    }

    /* On smaller screens: logos in a centered row near the top */
    @media (max-width: 900px) {
      .logos {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        position: absolute;
        top: 5rem;
        left: 0;
        right: 0;
      }

      .logo-link {
        position: static;
        width: 5rem;
        margin: 0;
      }

      /* Push the main content down so it doesn't sit under the logos */
      main {
        padding-top: 11rem;
      }

      .project {
        position: static;
        width: auto;
        margin: 0 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <h1 class="split">Masha Belyaeva</h1>

  <main>
    <p>
      Hello! My name is Masha. I am based out of the Bay Area and I enjoy most hobbies. Below are my socials and around are some projects I've worked on.
    </p>

    <div class="links">
      <a href="https://www.linkedin.com/in/belyaeva1" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin"></i>
      </a>
      <a href="https://www.instagram.com/mbelyaevaa" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://github.com/belyaeva9300" target="_blank" rel="noopener" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
  </main>

  <div class="logos">
    <a class="logo-link logo-nasa" href="https://science.nasa.gov/get-involved/citizen-science/nasa-data-hackathon-inspires-community-action/" target="_blank" rel="noopener" aria-label="NASA Data Hackathon article">
      <img src="images/nasa-logo.png" alt="NASA logo">
    </a>

    <a class="logo-link logo-2" href="https://xii.swamphacks.com/" target="_blank" rel="noopener" aria-label="Shxii">
      <img src="images/shxii.png" alt="Shxii logo">
    </a>
  </div>

  <div class="project project-3">
    <h2 class="split">Project Three</h2>
    <p class="split">Will input later</p>
  </div>

  <script>
    // Wrap every letter of each ".split" element in its own span
    document.querySelectorAll(".split").forEach(el => {
      const text = el.textContent.trim();
      el.setAttribute("aria-label", text);
      el.textContent = "";

      text.split(/\s+/).forEach((word, i, words) => {
        const wordSpan = document.createElement("span");
        wordSpan.className = "word";
        wordSpan.setAttribute("aria-hidden", "true");

        [...word].forEach(letter => {
          const ch = document.createElement("span");
          ch.className = "ch";
          ch.textContent = letter;
          wordSpan.appendChild(ch);
        });

        el.appendChild(wordSpan);
        if (i < words.length - 1) el.appendChild(document.createTextNode(" "));
      });
    });
  </script>

  <script>
    // Hover sounds from your own audio files
    const shimmer = new Audio("sounds/shimering.wav");
    const drum = new Audio("sounds/industrial-drum-loop.wav");

    shimmer.preload = "auto";
    drum.preload = "auto";
    drum.loop = true;          // keeps playing while the mouse is on the logo

    shimmer.volume = 0.6;      // 0 to 1
    drum.volume = 0.6;

    // Browsers block sound until the visitor's first click, tap or keypress,
    // so the first hover after a fresh load may be silent. That's normal.
    function play(audio) {
      audio.currentTime = 0;
      const attempt = audio.play();
      if (attempt) attempt.catch(() => {});
    }

    function stop(audio) {
      audio.pause();
      audio.currentTime = 0;
    }

    // NASA logo = shimmer (plays once)
    const nasa = document.querySelector(".logo-nasa");
    nasa.addEventListener("pointerenter", () => play(shimmer));
    nasa.addEventListener("pointerleave", () => stop(shimmer));

    // Shxii logo = industrial drum loop (plays while hovered, stops on leave)
    const shxii = document.querySelector(".logo-2");
    shxii.addEventListener("pointerenter", () => play(drum));
    shxii.addEventListener("pointerleave", () => stop(drum));
  </script>
</body>
</html>
