<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masha Belyaeva</title>

  <!-- Icon library for the social logos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    @font-face {
      font-family: "Gaussian Blur";
      src: url("fonts/gaussian_blur/gaussian_blur/Gaussian%20Blur.ttf") format("truetype");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Georgia, "Times New Roman", serif;
    }

    h1 {
      position: absolute;
      top: 24px;
      left: 28px;
      font-family: "Gaussian Blur", "Helvetica Neue", Arial, sans-serif;
      font-size: 2rem;
      font-weight: normal;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem;
    }

    p {
      max-width: 38rem;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .links {
      margin-top: 2.5rem;
      display: flex;
      gap: 1.75rem;
    }

    .links a {
      color: #111;
      font-size: 1.8rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .links a:hover { opacity: 0.5; }
  </style>
</head>
<body>
  <h1>Masha Belyaeva</h1>

  <main>
    <p>
      Type your paragraph here. Replace this text with whatever you want to say
      about yourself, your work, or anything else.
    </p>

    <div class="links">
      <a href="https://www.linkedin.com/in/YOUR-USERNAME" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin"></i>
      </a>
      <a href="https://www.instagram.com/YOUR-USERNAME" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://github.com/belyaeva9300" target="_blank" rel="noopener" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
  </main>
</body>
</html>
